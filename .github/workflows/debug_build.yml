name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - feature/chinese-localization
      - 'feature/**'
    paths-ignore:
      - '**.md'
      - 'img/**'
  pull_request:
    branches:
      - master
      - feature/chinese-localization
    paths-ignore:
      - '**.md'
      - 'img/**'

permissions:
  contents: write
  
jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    steps:
    - name: Clone repository
      uses: actions/checkout@v7
      with:
        submodules: false
        fetch-depth: 1
    - name: Validation
      uses: gradle/actions/wrapper-validation@v6.4.0

    - name: Java setup
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Restore cache
      uses: actions/cache@v6
      with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .git/modules
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '.gitmodules') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

    - name: Fetch submodules
      run: git submodule update --init --recursive --jobs 8 --depth 1

    - name: Build
      run: ./gradlew assembleDebug
    - name: Store app-universal-debug
      uses: actions/upload-artifact@v7
      with:
        name: termux-x11-universal-debug
        path: ./lorie-app/build/outputs/apk/standalone/debug/termux-x11-universal-debug.apk

    - name: Store sharedUid-debug APK
      uses: actions/upload-artifact@v7
      with:
        name: termux-x11-sharedUid-debug
        path: ./lorie-app/build/outputs/apk/sharedUid/debug/termux-x11-universal-sharedUid-debug.apk

    - name: Store companion package
      uses: actions/upload-artifact@v7
      with:
        name: termux-companion packages
        path: |
          ./shell-loader/build/outputs/companion/termux-x11-*-all.deb
          ./shell-loader/build/outputs/companion/termux-x11-*-any.pkg.tar.xz

    - name: Store unstripped libraries with debug symbols
      uses: actions/upload-artifact@v7
      with:
        name: termux-x11-unstripped-libraries-for-ndk-stack
        path: ./lorie/build/intermediates/cxx/Debug/*

    - name: Publish Chinese Localization Release
      uses: softprops/action-gh-release@v2
      if: success() && (github.ref == 'refs/heads/feature/chinese-localization' || github.ref == 'refs/heads/master')
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: zh-cn-release
        name: 'Termux:X11 官方中文汉化版'
        draft: false
        prerelease: false
        body: |
          ### Termux:X11 官方完整中文汉化版

          本版本基于 Termux:X11 官方最新主线源码进行全量深度中文本地化汉化。
          汉化覆盖设置菜单、分辨率模式、图像缩放、触摸板/模拟触控模式、手势响应、无障碍系统键拦截与按键栏等全部界面与提示。

          #### 安装包说明：
          * `termux-x11-universal-debug.apk`: 独立安装版 APK（推荐绝大多数手机、掌机与 Droidspaces 容器环境安装使用）
          * `termux-x11-universal-sharedUid-debug.apk`: Termux 共享 UID 版 APK（需与 Termux 主应用签名一致）
          * `termux-x11-*-all.deb`: Termux 终端配套包
        files: |
          ./lorie-app/build/outputs/apk/standalone/debug/termux-x11-universal-debug.apk
          ./lorie-app/build/outputs/apk/sharedUid/debug/termux-x11-universal-sharedUid-debug.apk
          ./shell-loader/build/outputs/companion/termux-x11-*-all.deb
          ./shell-loader/build/outputs/companion/termux-x11-*-any.pkg.tar.xz
